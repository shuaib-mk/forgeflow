name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Static analysis
        run: go vet ./cmd/... ./internal/... ./pkg/... ./cli/...
      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./internal/... ./pkg/... ./cli/...
      - name: Enforce core coverage
        run: |
          go test -count=1 -coverprofile=core-coverage.out ./internal/analytics ./internal/auth ./internal/authorization ./internal/events ./internal/projects ./internal/tasks ./internal/workflows
          ./scripts/check-coverage.sh core-coverage.out 70
      - name: Report aggregate coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: Build binaries
        run: go build -trimpath ./cmd/...

  frontend:
    name: Dashboard quality gates
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=high

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.5-alpine3.21
        env: { POSTGRES_DB: forgeflow, POSTGRES_USER: forgeflow, POSTGRES_PASSWORD: forgeflow }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forgeflow -d forgeflow"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.4-alpine3.21
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FORGEFLOW_DATABASE_URL: postgres://forgeflow:forgeflow@localhost:5432/forgeflow?sslmode=disable
      FORGEFLOW_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - run: go test -tags=integration -count=1 ./tests/integration/...

  containers:
    name: Reproducible containers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: ., target: api, push: false }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: web, push: false }
