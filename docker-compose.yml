name: forgeflow

x-app-environment: &app-environment
  FORGEFLOW_ENV: development
  FORGEFLOW_DATABASE_URL: postgres://forgeflow:${POSTGRES_PASSWORD:-forgeflow}@postgres:5432/forgeflow?sslmode=disable
  FORGEFLOW_REDIS_URL: redis://redis:6379/0
  FORGEFLOW_SESSION_SECRET: ${FORGEFLOW_SESSION_SECRET:-local-development-secret-change-me-123}
  FORGEFLOW_WORKSPACE_ROOT: /data/workspaces
  FORGEFLOW_LOG_LEVEL: ${FORGEFLOW_LOG_LEVEL:-info}
  FORGEFLOW_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8081

services:
  postgres:
    image: postgres:17.5-alpine3.21
    environment:
      POSTGRES_DB: forgeflow
      POSTGRES_USER: forgeflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgeflow}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U forgeflow -d forgeflow"], interval: 5s, timeout: 3s, retries: 20 }
    ports: ["5432:5432"]
  redis:
    image: redis:7.4.4-alpine3.21
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 20 }
    ports: ["6379:6379"]
  migrate:
    build: { context: ., target: migrate }
    command: [up]
    environment: *app-environment
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: { context: ., target: api }
    environment: *app-environment
    ports: ["8080:8080"]
    volumes: [workspace-data:/data/workspaces]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    healthcheck: { test: [CMD, wget, -qO-, http://127.0.0.1:8080/health], interval: 10s, timeout: 3s, retries: 10 }
    restart: unless-stopped
  worker:
    build: { context: ., target: worker }
    environment: *app-environment
    volumes: [workspace-data:/data/workspaces]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    init: true
    restart: unless-stopped
  web:
    build: { context: web }
    ports: ["5173:8080"]
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  postgres-data:
  workspace-data:

