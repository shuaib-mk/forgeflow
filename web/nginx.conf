server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; }
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location / { try_files $uri $uri/ /index.html; }
}

