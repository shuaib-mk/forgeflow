openapi: 3.1.0
info:
  title: ForgeFlow API
  version: 0.2.0
  description: Local-first project and workflow automation API.
servers:
  - url: http://localhost:8080/api/v1
security: [{ bearerAuth: [] }]
paths:
  /auth/register:
    post:
      security: []
      summary: Register an owner and their first organization
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201': { description: User and first organization created, content: { application/json: { schema: { $ref: '#/components/schemas/Registration' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      security: []
      summary: Exchange credentials for a bearer session
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, format: password } } } } }
      responses:
        '200': { description: Authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      summary: Revoke the current session
      responses: { '204': { description: Session revoked }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /auth/me:
    get:
      summary: Return the authenticated user
      responses: { '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } } }
  /organizations:
    get:
      summary: List organizations available to the current user
      responses:
        '200':
          description: Organization memberships
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/OrganizationMembership' } } } } } }
  /projects:
    get:
      summary: List visible projects
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, name] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses: { '200': { description: Project page, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectPage' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      summary: Create a project
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectInput' } } } }
      responses: { '201': { description: Project created, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }, '422': { $ref: '#/components/responses/ValidationError' } }
  /projects/{projectId}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Get a project
      responses: { '200': { description: Project, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /projects/{projectId}/tasks:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: List project tasks
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, done, canceled] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses: { '200': { description: Task page } }
    post:
      summary: Create a task
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title], properties: { title: { type: string, maxLength: 200 }, description: { type: string, maxLength: 10000 }, assigneeId: { type: string, format: uuid } } } } } }
      responses: { '201': { description: Task created, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } } }
  /projects/{projectId}/tasks/{taskId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Update a task status
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [open, in_progress, done, canceled] } } } } } }
      responses: { '200': { description: Updated task, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } } }
  /projects/{projectId}/repositories:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: List connected local repositories
      responses: { '200': { description: Repository list } }
    post:
      summary: Connect a Git repository beneath the configured workspace
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, localPath], properties: { name: { type: string }, localPath: { type: string }, initialize: { type: boolean, description: Create a managed Git repository at a relative workspace path. } } } } } }
      responses: { '201': { description: Repository connected, content: { application/json: { schema: { $ref: '#/components/schemas/Repository' } } } }, '422': { $ref: '#/components/responses/ValidationError' } }
  /projects/{projectId}/workflows:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: List project workflows
      responses:
        '200': { description: Workflow list, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Workflow' } } } } } } }
    post:
      summary: Create a validated workflow definition
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDefinition' } } } }
      responses: { '201': { description: Workflow created }, '422': { $ref: '#/components/responses/ValidationError' } }
  /workflows/{workflowId}/runs:
    post:
      summary: Queue a workflow run
      parameters: [{ name: workflowId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '202': { description: Run queued, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRun' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /runs:
    get:
      summary: List recent workflow runs
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses: { '200': { description: Workflow run page } }
  /runs/{runId}:
    get:
      summary: Get workflow run state
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses: { '200': { description: Run, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRun' } } } } }
  /runs/{runId}/logs:
    get:
      summary: Read ordered, bounded run logs
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { name: after, in: query, schema: { type: integer, minimum: -1, default: -1 } }
      responses: { '200': { description: Log chunks } }
  /analytics:
    get:
      summary: Get organization delivery counters
      parameters: [{ name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Analytics summary } }
  /audit:
    get:
      summary: List audit events
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses: { '200': { description: Audit event page } }
  /plugins:
    get:
      summary: List installed trusted plugins
      responses: { '200': { description: Plugin list } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: opaque }
  parameters:
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Permission denied, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ValidationError: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    User: { type: object, required: [id, email, displayName], properties: { id: { type: string, format: uuid }, email: { type: string, format: email }, displayName: { type: string } } }
    Organization: { type: object, required: [id, name, slug, createdAt], properties: { id: { type: string, format: uuid }, name: { type: string }, slug: { type: string }, createdAt: { type: string, format: date-time } } }
    OrganizationMembership: { type: object, required: [organization, role], properties: { organization: { $ref: '#/components/schemas/Organization' }, role: { type: string, enum: [owner, admin, developer, viewer] } } }
    Registration: { type: object, required: [user, organization], properties: { user: { $ref: '#/components/schemas/User' }, organization: { $ref: '#/components/schemas/Organization' } } }
    RegisterInput: { type: object, required: [email, displayName, password, organizationName, organizationSlug], properties: { email: { type: string, format: email }, displayName: { type: string, maxLength: 100 }, password: { type: string, minLength: 12, maxLength: 128 }, organizationName: { type: string, maxLength: 100 }, organizationSlug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' } } }
    Session: { type: object, required: [token, expiresAt, user], properties: { token: { type: string }, expiresAt: { type: string, format: date-time }, user: { $ref: '#/components/schemas/User' } } }
    ProjectInput: { type: object, required: [organizationId, name, slug], properties: { organizationId: { type: string, format: uuid }, name: { type: string, maxLength: 100 }, slug: { type: string }, description: { type: string, maxLength: 2000 } } }
    Project: { allOf: [{ $ref: '#/components/schemas/ProjectInput' }, { type: object, required: [id, createdAt, updatedAt], properties: { id: { type: string, format: uuid }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } } }] }
    ProjectPage: { type: object, required: [items, page, pageSize, totalItems, totalPages], properties: { items: { type: array, items: { $ref: '#/components/schemas/Project' } }, page: { type: integer }, pageSize: { type: integer }, totalItems: { type: integer }, totalPages: { type: integer } } }
    Task: { type: object, properties: { id: { type: string, format: uuid }, projectId: { type: string, format: uuid }, title: { type: string }, description: { type: string }, status: { type: string, enum: [open, in_progress, done, canceled] }, createdAt: { type: string, format: date-time } } }
    Repository: { type: object, properties: { id: { type: string, format: uuid }, projectId: { type: string, format: uuid }, name: { type: string }, localPath: { type: string }, defaultBranch: { type: string } } }
    WorkflowStep: { type: object, required: [id, command], properties: { id: { type: string }, name: { type: string }, command: { type: string }, args: { type: array, items: { type: string } }, dependsOn: { type: array, items: { type: string } }, retries: { type: integer, minimum: 0, maximum: 10 }, continueOnFail: { type: boolean } } }
    WorkflowDefinition: { type: object, required: [name, steps], properties: { name: { type: string, maxLength: 100 }, steps: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/WorkflowStep' } } } }
    Workflow: { allOf: [{ $ref: '#/components/schemas/WorkflowDefinition' }, { type: object, required: [id, projectId, version, createdAt, updatedAt], properties: { id: { type: string, format: uuid }, projectId: { type: string, format: uuid }, version: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } } }] }
    WorkflowRun: { type: object, properties: { id: { type: string, format: uuid }, workflowId: { type: string, format: uuid }, projectId: { type: string, format: uuid }, status: { type: string, enum: [queued, running, succeeded, failed, canceled, timed_out] }, error: { type: string }, createdAt: { type: string, format: date-time } } }
    Error: { type: object, required: [error], properties: { error: { type: object, required: [code, message, requestId], properties: { code: { type: string }, message: { type: string }, requestId: { type: string }, fields: { type: object, additionalProperties: { type: string } } } } } }
